name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Gradle project
        shell: bash
        run: |
          echo "Repository root:"
          pwd
          echo "Files and folders:"
          ls -la
          echo "Searching for Gradle settings:"
          find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          validate-wrappers: false

      - name: Check Gradle installation
        run: gradle --version

      - name: Build Android APK
        shell: bash
        run: |
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "SS-MediaOS-SMS-main/settings.gradle" ] || [ -f "SS-MediaOS-SMS-main/settings.gradle.kts" ]; then
            PROJECT_DIR="SS-MediaOS-SMS-main"
          else
            echo "ERROR: Gradle settings file not found."
            echo "Check the Locate Gradle project step above."
            exit 1
          fi

          echo "Building from: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSMediaOS-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SS-MediaOS-SMS-main/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
